name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 同一个分支又推了新的，旧的就不跑了。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 本仓库的分支推送时已经跑过，PR 只跑来自 fork 的。
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 桌面应用在 Linux 上依赖的系统库（Tauri / WebKitGTK）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: 界面类型检查和构建
        working-directory: app
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      # clippy 没过也跑测试，一次看全。
      - run: cargo test --workspace --no-fail-fast
        if: ${{ !cancelled() }}

  # 手机端：核心库的测试（含三端共用的契约）和应用能编译。
  ios:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path mobile/ios/DuoloKit
      - run: brew install xcodegen
      - run: xcodegen
        working-directory: mobile/ios
      - run: xcodebuild -project Duolo.xcodeproj -scheme Duolo -destination 'generic/platform=iOS Simulator' -quiet build CODE_SIGNING_ALLOWED=NO
        working-directory: mobile/ios

  android:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew :core:test :app:lintDebug :app:assembleRelease --console=plain
        working-directory: mobile/android

  # 三个系统各打一次安装包，确认能打出来（macOS .app、Windows .msi / .exe、Linux .deb / AppImage）。
  bundle:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux 系统库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm tauri build
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: duolo-${{ runner.os }}
          path: |
            target/release/bundle/macos/*.app
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  server:
    # 本仓库的分支推送时已经跑过，PR 只跑来自 fork 的。
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: duolo
          POSTGRES_PASSWORD: duolo
          POSTGRES_DB: duolo
        ports: ["54329:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm check
      - run: pnpm test
