[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/OtterMind/duolo"

[workspace.dependencies]
duolo-core = { path = "crates/duolo-core" }
duolo-agent = { path = "crates/duolo-agent" }
duolo-chat = { path = "crates/duolo-chat" }
duolo-git = { path = "crates/duolo-git" }
duolo-pty = { path = "crates/duolo-pty" }
duolo-voice = { path = "crates/duolo-voice" }
duolo-link = { path = "crates/duolo-link" }
duolo-engine = { path = "crates/duolo-engine" }
duolo-tui = { path = "crates/duolo-tui" }
duolo-cli = { path = "crates/duolo-cli" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
sys-locale = "0.3"
which = "8.0.6"
clap = { version = "4", features = ["derive", "string"] }
ratatui = "0.30"
tui-term = "0.3"
vt100 = "0.16"
portable-pty = "0.9"
unicode-width = "0.2"
libc = "0.2"
windows-sys = "0.61"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
cpal = "0.18"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ureq = { version = "3", features = ["json"] }
# 电脑和手机之间端到端加密（见 docs/mobile.md、mobile/contract/crypto.json）。
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
