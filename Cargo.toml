[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/OtterMind/duolo"

[workspace.dependencies]
duolo-core = { path = "crates/duolo-core" }
duolo-git = { path = "crates/duolo-git" }
duolo-pty = { path = "crates/duolo-pty" }
duolo-voice = { path = "crates/duolo-voice" }
duolo-engine = { path = "crates/duolo-engine" }
duolo-tui = { path = "crates/duolo-tui" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
tui-term = "0.3"
vt100 = "0.16"
portable-pty = "0.9"
unicode-width = "0.2"
libc = "0.2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
