# Claude Code。字段说明见 docs/agents.md。
schema = 1
id = "claude"
name = "Claude"
command = "claude"
icon_color = "#d97757"

[install]
default = "npm install -g @anthropic-ai/claude-code"

[start]
prompt = "argument"
separator = "--"
resume_args = ["--continue"]
resume_session_args = ["--resume", "{session}"]
session_id_args = ["--session-id", "{session}"]
# 在终端里审阅时用计划模式：只看不改，要改文件得先让用户同意。
review_args = ["--permission-mode", "plan"]
# 不在启动时自己升级（升级由用户决定，也免得升级到一半换了界面）。
env = { DISABLE_AUTOUPDATER = "1" }

# 钩子（见 docs/agent-compat.md）：会话开始时告诉 Duolo 准确的会话编号（清空对话后也跟得上），
# 请求授权时告诉它要用什么工具、做什么。设置文件每次启动时交给它，不改用户的配置。
# 后面是最早支持这个事件的版本：旧版遇到不认识的事件会拒绝整个设置文件（版本取自 Orca 整理的 Claude Code 事件表）。
[hooks]
format = "claude"
args = ["--settings", "{settings}"]
events = { SessionStart = "1.0.62", PermissionRequest = "2.0.45" }

# 第一次在一个文件夹里启动时问的"信任这个文件夹吗"：按文件夹的真实路径记在 .claude.json 里，子文件夹不继承。
[trust]
format = "claude"
file = ".claude.json"
env = "CLAUDE_CONFIG_DIR"
env_file = ".claude.json"
scope = "worktree"

# 只读：只给读文件的工具。`--restricted` 不读用户和项目的设置（那里可能放开了命令和写文件），
# `--strict-mcp-config` 不接 MCP 服务（它们的工具可能会改东西）。改动由 Duolo 写进 DUOLO_REVIEW.md，不用运行 git。
# `--tools` 之类会吞掉后面的参数，提示词前面必须有 `--`。
[review]
args = [
  "-p",
  "--restricted",
  "--strict-mcp-config",
  "--no-session-persistence",
  "--permission-mode", "dontAsk",
  "--tools", "Read,Grep,Glob",
  "--allowedTools", "Read,Grep,Glob",
]
separator = "--"

[quick]
args = ["-p", "--no-session-persistence", "--strict-mcp-config", "--model", "haiku"]
separator = "--"

[screen]
# 确认框是 "1. Yes" 开头的选项；第一次打开目录的信任提示没有编号，底部写着按 Enter 确认。
approval = ["1. yes", "do you want to proceed", "enter to confirm"]
busy = ["esc to interrupt", "esc to cancel"]
choosing = ["enter to confirm"]

[keys]
interrupt = "\u001B"
newline = "\u001B\r"

[transcript]
format = "claude"
home = ".claude"
home_env = "CLAUDE_CONFIG_DIR"

# 从 Claude Code 里启动 Duolo 时会被继承下来，让 Agent 以为自己是子会话（例如不保存对话记录，之后就无法恢复）。
[env]
remove = [
  "CLAUDECODE",
  "CLAUDE_CODE_ENTRYPOINT",
  "CLAUDE_CODE_SESSION_ID",
  "CLAUDE_CODE_CHILD_SESSION",
  "CLAUDE_CODE_SESSION_ATTENDED",
  "CLAUDE_CODE_MESSAGING_SOCKET",
  "CLAUDE_CODE_MESSAGING_TOKEN",
  "CLAUDE_CODE_EXECPATH",
  "CLAUDE_PID",
  "CLAUDE_EFFORT",
]
