# Claude Code。字段说明见 docs/agents.md。
schema = 1
id = "claude"
name = "Claude"
command = "claude"
icon_color = "#d97757"

# 官方的安装脚本，不用先装 Node（和 T3 Code 一样）。
[install]
default = "curl -fsSL https://claude.ai/install.sh | bash"
windows = "irm https://claude.ai/install.ps1 | iex"
# 安装脚本把命令放在这里，但不一定加进 shell 的 PATH。
bin_dirs = ["~/.local/bin"]
# `claude update` 照原来的安装方式升级（Homebrew、npm 装的会告诉用户用哪条命令）。
update_args = ["update"]
# 查最新版本用（设置的"关于"）；不管用什么方式装的，版本号都和 npm 上的一致。
npm = "@anthropic-ai/claude-code"

# Claude 的订阅（Pro、Max）直接登录 Claude Code，额度和客户端共用。装了 Claude 桌面版就说明用户有这个账号。
[account]
status_args = ["auth", "status"]
login_args = ["auth", "login"]
apps = [
  { name = "Claude", macos = ["/Applications/Claude.app", "~/Applications/Claude.app"], windows = ["{LOCALAPPDATA}/AnthropicClaude/claude.exe"] },
]
# 多个账号：每个账号一个配置文件夹，启动时用 CLAUDE_CONFIG_DIR 指过去（Orca 也是这么做的）。
home_env = "CLAUDE_CONFIG_DIR"
home = "~/.claude"
# 新账号的文件夹里链接到 ~/.claude 的：对话记录在这些账号之间共用，换了账号能用 --resume 接着做。
# 登录信息（.claude.json、钥匙串里的）每个账号自己的。
share = [
  "projects", "history.jsonl", "file-history", "todos", "plans", "shell-snapshots", "session-env", "paste-cache",
  "settings.json", "CLAUDE.md", "agents", "commands", "skills", "plugins", "output-styles", "keybindings.json",
]
# Orca 里登录好的账号（它的"账号"设置），直接用，不用再登录一次。
import = [
  { name = "Orca", macos = ["~/Library/Application Support/orca/claude-profiles/*/home"], linux = ["~/.config/orca/claude-profiles/*/home"], windows = ["{APPDATA}/orca/claude-profiles/*/home"] },
]
# 额度用完时报的错误类型（StopFailure 钩子、stream-json 的出错回复）。
limit_errors = ["rate_limit"]

[start]
prompt = "argument"
separator = "--"
resume_args = ["--continue"]
resume_session_args = ["--resume", "{session}"]
session_id_args = ["--session-id", "{session}"]
# 在终端里审阅时用计划模式：只看不改，要改文件得先让用户同意。
review_args = ["--permission-mode", "plan"]
# Duolo 的补充说明（怎么用 `duolo` 命令建定时任务）追加到系统提示后面，不换掉 Claude Code 自己的。
instructions_args = ["--append-system-prompt", "{instructions}"]
# 不在启动时自己升级（升级由用户决定，也免得升级到一半换了界面）。
# 打开"下一步建议"：回答完后把建议的下一句灰着写进输入框（Tab 采用），不然要等服务器分批放开。
env = { DISABLE_AUTOUPDATER = "1", CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION = "1" }

# 钩子（见 docs/agent-compat.md）：会话开始时告诉 Duolo 准确的会话编号（清空对话后也跟得上），
# 请求授权时告诉它要用什么工具、做什么。设置文件每次启动时交给它，不改用户的配置。
# 后面是最早支持这个事件的版本：旧版遇到不认识的事件会拒绝整个设置文件（版本取自 Orca 整理的 Claude Code 事件表）。
[hooks]
format = "claude"
args = ["--settings", "{settings}"]
# StopFailure：这一轮因为出错停了，带着错误类型（额度用完时换账号接着做）。
events = { SessionStart = "1.0.62", PermissionRequest = "2.0.45", StopFailure = "2.1.78" }

# 第一次在一个文件夹里启动时问的"信任这个文件夹吗"：按文件夹的真实路径记在 .claude.json 里，子文件夹不继承。
[trust]
format = "claude"
file = ".claude.json"
env = "CLAUDE_CONFIG_DIR"
env_file = ".claude.json"
scope = "worktree"

# 只读：只给读文件的工具。`--restricted` 不读用户和项目的设置（那里可能放开了命令和写文件），
# `--strict-mcp-config` 不接 MCP 服务（它们的工具可能会改东西）。改动由 Duolo 写进 DUOLO_REVIEW.md，不用运行 git。
# `--tools` 之类会吞掉后面的参数，提示词前面必须有 `--`。
[review]
args = [
  "-p",
  "--restricted",
  "--strict-mcp-config",
  "--no-session-persistence",
  "--permission-mode", "dontAsk",
  "--tools", "Read,Grep,Glob",
  "--allowedTools", "Read,Grep,Glob",
]
separator = "--"

[quick]
args = ["-p", "--no-session-persistence", "--strict-mcp-config", "--model", "haiku"]
separator = "--"

[screen]
# 确认框是 "1. Yes" 开头的选项；第一次打开目录的信任提示没有编号，底部写着按 Enter 确认。
approval = ["1. yes", "do you want to proceed", "enter to confirm"]
busy = ["esc to interrupt", "esc to cancel"]
choosing = ["enter to confirm"]

[keys]
interrupt = "\u001B"
newline = "\u001B\r"

[transcript]
format = "claude"
home = ".claude"
home_env = "CLAUDE_CONFIG_DIR"

# 从 Claude Code 里启动 Duolo 时会被继承下来，让 Agent 以为自己是子会话（例如不保存对话记录，之后就无法恢复）。
[env]
remove = [
  "CLAUDECODE",
  "CLAUDE_CODE_ENTRYPOINT",
  "CLAUDE_CODE_SESSION_ID",
  "CLAUDE_CODE_CHILD_SESSION",
  "CLAUDE_CODE_SESSION_ATTENDED",
  "CLAUDE_CODE_MESSAGING_SOCKET",
  "CLAUDE_CODE_MESSAGING_TOKEN",
  "CLAUDE_CODE_EXECPATH",
  "CLAUDE_PID",
  "CLAUDE_EFFORT",
]

# 聊天模式：stream-json（Agent SDK 用的同一套），授权请求交给 Duolo 回答。会话和终端里是同一套，接回也用 --resume。
# 它问用户选择题的工具（AskUserQuestion）在这里答不了，关掉，让它直接在回复里问。
[chat]
protocol = "claude"
args = [
  "-p",
  "--input-format", "stream-json",
  "--output-format", "stream-json",
  "--verbose",
  "--include-partial-messages",
  "--permission-prompt-tool", "stdio",
  "--disallowedTools", "AskUserQuestion",
]
resume_session_args = ["--resume", "{session}"]
resume_args = ["--continue"]
env = { DISABLE_AUTOUPDATER = "1" }
