# Codex CLI。字段说明见 docs/agents.md。
schema = 1
id = "codex"
name = "Codex"
command = "codex"
# 更旧的版本少了 Duolo 要用的东西（和 Orca 的下限一样）。
minimum_version = "0.136.0"

# 官方的安装脚本，不用先装 Node（和 T3 Code 一样）。
[install]
default = "curl -fsSL https://chatgpt.com/codex/install.sh | sh"
windows = "irm https://chatgpt.com/codex/install.ps1 | iex"
bin_dirs = ["~/.local/bin"]
# `codex update` 照原来的安装方式升级；0.126.0 起才有（Orca 的资料）。
update_args = ["update"]
update_since = "0.126.0"

# ChatGPT 的账号（Plus、Pro、Team）直接登录 Codex，用的是同一份额度。
# 装了 ChatGPT 或 Codex 的桌面客户端，就说明用户有这个账号。
[account]
status_args = ["login", "status"]
login_args = ["login"]
apps = [
  { name = "ChatGPT", macos = ["/Applications/ChatGPT.app", "~/Applications/ChatGPT.app"] },
  { name = "Codex", macos = ["/Applications/Codex.app", "~/Applications/Codex.app"] },
]
# 多个账号：每个账号一个 CODEX_HOME。对话记录、配置链接到 ~/.codex，换了账号能接着做。
home_env = "CODEX_HOME"
home = "~/.codex"
share = ["sessions", "archived_sessions", "history.jsonl", "config.toml", "AGENTS.md", "prompts", "skills", "rules"]
import = [
  { name = "Orca", macos = ["~/Library/Application Support/orca/codex-accounts/*/home"], linux = ["~/.config/orca/codex-accounts/*/home"], windows = ["{APPDATA}/orca/codex-accounts/*/home"] },
]
# 聊天模式（app-server）里一轮失败时的 codexErrorInfo。终端里没有钩子报这个，只能手动换。
limit_errors = ["usageLimitExceeded"]

[start]
# 启动时的"有新版本"对话框：在那里按回车会选"现在升级"，装完就退出。
always_args = ["-c", "check_for_update_on_startup=false"]
prompt = "argument"
separator = "--"
resume_args = ["resume", "--last"]
resume_session_args = ["resume", "{session}"]
review_args = ["--sandbox", "read-only"]

# 只读沙箱由系统强制（macOS、Linux）。沙箱管不到的也关掉：MCP 服务、联网搜索；
# 功能只留下运行只读命令要用的，其余开着的一律关掉（连到云端应用、插件、浏览器、钩子……），以后新加的功能也默认关着。
# Codex 升级后审阅读不了文件时，看看运行命令是不是换了功能名，补进 allow。
[review]
args = [
  "exec", "--sandbox", "read-only", "--skip-git-repo-check", "--color", "never", "--ephemeral",
  "-c", "mcp_servers={}",
  "-c", "web_search=disabled",
  "-c", "check_for_update_on_startup=false",
]
separator = "--"

[review.features]
list = ["features", "list"]
allow = [
  "shell_tool", "unified_exec", "unified_exec_tty", "shell_snapshot",
  "code_mode_host", "code_mode_host_grpc", "code_mode_host_output_truncation", "code_mode_interrupt",
]
disable = ["-c", "features.{feature}=false"]

# 起分支名、整理口述：只要它回一句话，什么工具都不用。
[quick]
args = [
  "exec", "--sandbox", "read-only", "--skip-git-repo-check", "--color", "never",
  "--ephemeral", "-c", "model_reasoning_effort=low",
  "-c", "mcp_servers={}",
  "-c", "web_search=disabled",
  "-c", "check_for_update_on_startup=false",
]
separator = "--"

[quick.features]
list = ["features", "list"]
disable = ["-c", "features.{feature}=false"]

[screen]
# 信任目录、是否升级这样的对话框，底部写着 "enter continue"（旧版是 "Press enter to continue"）。
approval = [
  "1. yes", "allow command", "would you like to run the following command",
  "enter to confirm", "enter continue", "enter to continue",
]
busy = ["esc to interrupt", "esc to cancel"]
choosing = ["enter to confirm", "enter continue", "enter to continue"]

[keys]
interrupt = "\u001B"
newline = "\u001B\r"

[transcript]
format = "codex"
home = ".codex"
home_env = "CODEX_HOME"

# 信任是按仓库记的：在 worktree 里启动时，记的是主仓库（"Trusting will apply to the repository root"）。
[trust]
format = "codex"
file = ".codex/config.toml"
env = "CODEX_HOME"
env_file = "config.toml"
scope = "repo"

# 聊天模式：app-server（VS Code 插件用的同一套）。会话（thread）编号和 `codex resume` 用的一样。
[chat]
protocol = "codex"
args = ["app-server", "-c", "check_for_update_on_startup=false"]
