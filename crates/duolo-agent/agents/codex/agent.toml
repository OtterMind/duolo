# Codex CLI。字段说明见 docs/agents.md。
schema = 1
id = "codex"
name = "Codex"
command = "codex"

[install]
default = "npm install -g @openai/codex"

[start]
prompt = "argument"
separator = "--"
resume_args = ["resume", "--last"]
resume_session_args = ["resume", "{session}"]
review_args = ["--sandbox", "read-only"]

# 只读沙箱由系统强制（macOS、Linux）。沙箱管不到的也关掉：MCP 服务、联网搜索，以及连到云端应用、插件、
# 浏览器、生成图片、钩子的功能（它们的工具能改云端的东西）。功能名用 `-c features.<名>=false`：
# 不认识的名字会被忽略，`--disable` 遇到不认识的会报错。
[review]
args = [
  "exec", "--sandbox", "read-only", "--skip-git-repo-check", "--color", "never", "--ephemeral",
  "-c", "mcp_servers={}",
  "-c", "web_search=disabled",
  "-c", "features.apps=false",
  "-c", "features.plugins=false",
  "-c", "features.remote_plugin=false",
  "-c", "features.browser_use=false",
  "-c", "features.browser_use_external=false",
  "-c", "features.computer_use=false",
  "-c", "features.image_generation=false",
  "-c", "features.hooks=false",
  "-c", "features.goals=false",
  "-c", "features.tool_suggest=false",
]
separator = "--"

[quick]
args = [
  "exec", "--sandbox", "read-only", "--skip-git-repo-check", "--color", "never",
  "--ephemeral", "-c", "model_reasoning_effort=low",
  "-c", "mcp_servers={}",
  "-c", "web_search=disabled",
  "-c", "features.apps=false",
  "-c", "features.plugins=false",
  "-c", "features.hooks=false",
]
separator = "--"

[screen]
# 信任目录、是否升级这样的对话框，底部写着 "enter continue"（旧版是 "Press enter to continue"）。
approval = [
  "1. yes", "allow command", "would you like to run the following command",
  "enter to confirm", "enter continue", "enter to continue",
]
busy = ["esc to interrupt", "esc to cancel"]
choosing = ["enter to confirm", "enter continue", "enter to continue"]

[keys]
interrupt = "\u001B"
newline = "\u001B\r"

[transcript]
format = "codex"
home = ".codex"
home_env = "CODEX_HOME"
