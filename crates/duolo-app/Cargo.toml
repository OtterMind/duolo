[package]
name = "duolo-app"
description = "Duolo desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "duolo-app"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
duolo-cli.workspace = true
duolo-core.workspace = true
duolo-engine.workspace = true
duolo-git.workspace = true
duolo-link.workspace = true
duolo-voice.workspace = true
which.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "=2.4.1"
sys-locale.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"

# Windows / Linux 上按住说话用全局快捷键（macOS 监听 Fn 键，见 fnkey.rs）。
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-global-shortcut = "=2.4.1"

[dev-dependencies]
tempfile.workspace = true
