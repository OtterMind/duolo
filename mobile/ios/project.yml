# Xcode 工程由 XcodeGen 生成（工程文件不进仓库）：cd mobile/ios && xcodegen
name: Duolo
options:
  bundleIdPrefix: ai.ottermind
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  DuoloKit:
    path: DuoloKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
targets:
  Duolo:
    type: application
    platform: iOS
    sources:
      - path: Duolo
      # 语言包只有一份：仓库根目录的 locales，原样打包。
      - path: ../../locales
        type: folder
        buildPhase: resources
      - path: ../fonts/MonaSans.ttf
        buildPhase: resources
      - path: ../fonts/OFL.txt
        buildPhase: resources
      - path: ../LICENSES.md
        buildPhase: resources
    dependencies:
      - package: DuoloKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ottermind.duolo
        PRODUCT_NAME: Duolo
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Duolo/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
schemes:
  Duolo:
    build:
      targets:
        Duolo: all
    run:
      config: Debug
