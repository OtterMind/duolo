# 本地开发和测试用的 PostgreSQL：docker compose up -d
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: duolo
      POSTGRES_PASSWORD: duolo
      POSTGRES_DB: duolo
    ports:
      - "54329:5432"
    volumes:
      - duolo-pg:/var/lib/postgresql/data
volumes:
  duolo-pg:
